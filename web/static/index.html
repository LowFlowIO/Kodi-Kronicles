<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kodi Kronicles</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <a href="/" class="logo-link">
        <img class="logo" src="/logo.png" alt="Kodi Kronicles">
      </a>
      <h1 class="sr-only">Kodi Kronicles</h1>
    </div>
            <div class="top-actions">
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="statusText">connecting…</span>
      </div>
      <div class="menu" id="appMenu">
        <button class="btn menu-toggle" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu"><span class="burger" aria-hidden="true"></span></button>
        <div class="menu-pop" id="menuPop" hidden>
          <label class="menu-item switch">
            <span>Wide posters</span>
            <span class="switch-ctl">
              <input type="checkbox" id="wideToggle" checked>
              <span class="knob"></span>
            </span>
          </label>
          <label class="menu-item switch">
            <span>Light mode</span>
            <span class="switch-ctl">
              <input type="checkbox" id="lightToggle">
              <span class="knob"></span>
            </span>
          </label>
          <div class="menu-sep"></div>
          <button class="menu-item" id="ignoreBtn" type="button">Ignore rules</button>
          <a class="menu-item" id="backupBtn" href="/api/backup.zip">Full backup</a>
          <a class="menu-item" id="exportBtn" href="/api/export.json">Export JSON</a>
          <button class="menu-item" id="scanBtn" type="button">Find Kodi</button>
        </div>
      </div>
    </div>
  </header>

  <section class="discover" id="discover" hidden>
    <div class="discover-head">
      <strong id="discoverTitle">Looking for Kodi…</strong>
      <span id="discoverHint"></span>
      <button class="btn discover-close" id="discoverClose" type="button" aria-label="Close">Close</button>
    </div>
    <div class="discover-list" id="discoverList"></div>
    <form class="discover-form" id="targetForm">
      <input id="kodiHost" placeholder="host or IP" autocomplete="off">
      <input id="kodiPort" placeholder="8080" inputmode="numeric">
      <input id="kodiUser" placeholder="user">
      <input id="kodiPass" placeholder="password" type="password">
      <button type="submit">Use this box</button>
    </form>
  </section>

  <section class="ignore" id="ignorePanel" hidden>
    <div class="discover-head">
      <strong>Skip / ignore</strong>
      <span>Dropped at log time. Never sent to Kodi.</span>
      <button class="btn discover-close" id="ignoreClose" type="button">Close</button>
    </div>
    <form class="discover-form" id="ignoreForm">
      <input id="ignMin" placeholder="min seconds" inputmode="numeric">
      <input id="ignKinds" placeholder="kinds to skip (youtube, plugin)">
      <input id="ignTitle" placeholder="title contains (trailer)">
      <input id="ignFile" placeholder="file contains (sample)">
      <input id="ignPlugin" placeholder="plugin id contains">
      <button type="submit">Save rules</button>
    </form>
  </section>

  <section class="now" id="nowCard">
    <div class="now-art" id="nowArt"></div>
    <div class="now-body">
      <div class="eyebrow" id="nowEyebrow">Nothing playing</div>
      <h2 id="nowTitle">Idle</h2>
      <p class="now-meta" id="nowMeta"></p>
      <div class="progress">
        <div class="bar" id="nowBar"></div>
      </div>
      <div class="now-times">
        <span id="nowPos">0:00</span>
        <span id="nowState"></span>
        <span id="nowDur">0:00</span>
      </div>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="heat-wrap">
    <div class="heat-head">
      <h3 id="heatTitle">Year</h3>
      <span id="heatLegend">watch time</span>
    </div>
    <div class="heat-board">
      <div class="heat-y" id="heatY"></div>
      <div class="heat" id="heat"></div>
      <div class="heat-x" id="heatX"></div>
    </div>
  </section>

  <section class="toolbar">
    <div class="range-chips" id="rangeChips">
      <button type="button" class="chip on" data-range="all">All</button>
      <button type="button" class="chip" data-range="today">Today</button>
      <button type="button" class="chip" data-range="week">This week</button>
      <button type="button" class="chip" data-range="month">This month</button>
    </div>
    <input id="search" type="search" placeholder="Search title, show, file, URL…" autocomplete="off">
    <select id="box">
      <option value="all">All boxes</option>
    </select>
    <select id="kind">
      <option value="all">All kinds</option>
      <option value="movie">Movies</option>
      <option value="episode">Episodes</option>
      <option value="youtube">YouTube</option>
      <option value="iptv">IPTV / Live</option>
      <option value="plugin">Plugins</option>
      <option value="web">Web</option>
      <option value="idle">Idle</option>
      <option value="musicvideo">Music videos</option>
      <option value="video">Other video</option>
    </select>
    <input id="from" type="date">
    <input id="to" type="date">
    <select id="view">
      <option value="timeline" selected>Timeline</option>
      <option value="series">Series rollup</option>
    </select>
  </section>

  <section class="log" id="log"></section>
  <div class="pager" id="pager" hidden>
    <button id="prevPage" type="button">Newer</button>
    <span id="pageLabel">Page 1</span>
    <button id="nextPage" type="button">Older</button>
  </div>

  <footer class="site-foot">
    <a href="https://lowio.xyz" target="_blank" rel="noopener">lowio.xyz</a>
    <span>·</span>
    <a href="https://github.com/LowFlowIO/Kodi-Kronicles" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
