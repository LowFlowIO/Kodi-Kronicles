<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now playing</title>
  <style>
    :root {
      --bg: #0b0c10; --card: #14161c; --ink: #f4f1ea; --muted: #9aa3b2;
      --line: rgba(255,255,255,.12); --accent: #3ec6ff; --hard: #1b1e27;
    }
    html.garden {
      --bg: #cbc4b3; --card: #cbc4b3; --ink: #2e2720; --muted: #6b5f52;
      --line: #7a6e5f; --accent: #5b8a82; --hard: #5a5045;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; }
    body {
      font-family: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Monaco, Consolas, monospace;
      color: var(--ink); background: var(--bg);
    }
    a.card {
      display: grid;
      grid-template-columns: 118px 1fr;
      grid-template-rows: 1fr auto;
      gap: 10px 12px;
      height: 100%; min-height: 190px; padding: 10px;
      text-decoration: none; color: inherit;
    }
    a.card.wide { grid-template-columns: minmax(200px, 46%) 1fr; }
    .art {
      grid-row: 1 / span 2;
      align-self: stretch;
      background: var(--hard) center / contain no-repeat;
      border: 2px solid var(--line);
      min-height: 0;
    }
    a.card.wide .art {
      aspect-ratio: 16 / 9;
      align-self: center;
      background-size: cover;
    }
    .art.empty { background: linear-gradient(160deg, #8a7f70, #5a5045); }
    html:not(.garden) .art.empty { background: linear-gradient(160deg, #242836, #0f1117); }
    .body { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
    .tags { display: flex; gap: 6px; align-items: center; font-size: 10px; letter-spacing: .08em; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    h1 { margin: 0; font-size: 13px; line-height: 1.25; font-weight: 700;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    p { margin: 0; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { height: 4px; background: color-mix(in srgb, var(--ink) 12%, transparent); margin-top: 4px; }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); }
    .live-line {
      grid-column: 2;
      font-size: 10px; letter-spacing: .04em; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    a.card.wide .live-line { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <a class="card" id="card" href="/" target="_blank" rel="noopener">
    <div class="art empty" id="art"></div>
    <div class="body">
      <div class="tags"><span class="dot" id="dot"></span><span id="status">…</span></div>
      <h1 id="title">Kodi Kronicles</h1>
      <p id="meta">waiting for the box</p>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="live-line">Live from my living room Kodi instance.</div>
  </a>
  <script>
    const q = new URLSearchParams(location.search);
    if ((q.get("theme") || "garden") !== "dark") document.documentElement.classList.add("garden");
    const base = (q.get("base") || location.pathname.replace(/[^/]+$/, "") || "/").replace(/\/+$/, "") + "/";
    document.getElementById("card").href = base;
    const WIDE = ["youtube", "web", "iptv", "musicvideo", "plugin"];
    function fmt(s) {
      s = Math.max(0, Number(s) || 0);
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return m + ":" + String(r).padStart(2, "0");
    }
    function artWide(kind, url) {
      if (WIDE.includes(String(kind || "").toLowerCase())) return true;
      return false;
    }
    async function tick() {
      try {
        const n = await (await fetch(base + "api/now", { cache: "no-store" })).json();
        const media = n.media || {};
        const title = media.show_title && media.title && media.kind === "episode"
          ? media.show_title + " · " + media.title
          : (media.title || (n.connected ? "Nothing playing" : "Kodi offline"));
        document.getElementById("title").textContent = title;
        const st = !n.connected ? "OFFLINE" : n.playing ? "NOW PLAYING" : n.paused ? "PAUSED" : "IDLE";
        document.getElementById("status").textContent = st;
        document.getElementById("dot").className = "dot" + (n.playing ? " on" : "");
        const bits = [media.kind, n.box_name || n.box_host, n.playing || n.paused ? fmt(n.watched_seconds) : ""].filter(Boolean);
        document.getElementById("meta").textContent = bits.join(" · ") || "Kodi Kronicles";
        document.getElementById("bar").style.width = Math.min(100, n.progress_percent || 0) + "%";
        const card = document.getElementById("card");
        const art = document.getElementById("art");
        const poster = media.poster_path ? (base + "posters/" + media.poster_path) : "";
        card.classList.toggle("wide", artWide(media.kind));
        if (poster) {
          art.className = "art";
          art.style.backgroundImage = "url('" + poster + "')";
          if (!artWide(media.kind)) {
            const img = new Image();
            img.onload = function () {
              if (img.naturalWidth > img.naturalHeight) card.classList.add("wide");
            };
            img.src = poster;
          }
        } else {
          art.className = "art empty";
          art.style.backgroundImage = "";
        }
      } catch (e) {
        document.getElementById("status").textContent = "UNREACHABLE";
        document.getElementById("title").textContent = "Kodi Kronicles";
      }
    }
    tick();
    setInterval(tick, 5000);
  </script>
</body>
</html>
